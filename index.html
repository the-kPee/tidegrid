<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b2730"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tidegrid"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg"><title>Tidegrid — Octopus Puzzle</title>
<style>
:root{--ocean:#091d24;--deep:#0d2932;--panel:#10333d;--line:#22505a;--sea:#62d8c4;--coral:#f1a66a;--foam:#f4f0df;--muted:#91b7b4;--cell:1fr}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--ocean);color:var(--foam);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif}body{display:flex;justify-content:center;overflow-x:hidden;background:radial-gradient(ellipse at 50% -5%,#17434a 0,#0c2830 36%,#091d24 78%)}button{font:inherit;color:inherit;border:0;cursor:pointer}#app{width:min(100%,480px);min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:15px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:44px;height:44px;border-radius:16px;background:var(--sea);display:grid;place-items:center;font-size:26px;box-shadow:0 5px 16px #0004}.word{font-size:22px;font-weight:900;letter-spacing:.02em}.sub{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}.iconbtn{width:44px;height:44px;background:#143944;border:1px solid #28606a;border-radius:15px;font-size:20px}.stats{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:9px}.stat{background:#102f38;border:1px solid #1c4852;border-radius:16px;padding:9px 12px}.stat label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.stat strong{font-size:21px;font-weight:850}.stat.center{text-align:center;background:#123942}.stat.center strong{color:var(--sea);font-size:26px}.boardwrap{position:relative;width:100%;}.board{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;padding:7px;border-radius:19px;background:#0e3039;border:1px solid #28606a;box-shadow:0 14px 30px #0003;touch-action:none;user-select:none}.cell{aspect-ratio:1;border-radius:5px;background:#153b44;position:relative;display:grid;place-items:center;transition:background .12s,transform .12s}.cell:nth-child(3n+1){ } .cell.boxedge{ } .cell.filled{background:#62d8c4;box-shadow:inset 0 -3px 0 #2e9c91}.cell.filled:after{content:"";width:40%;height:40%;border-radius:50%;background:#b4fff0;opacity:.75}.cell.octopus:after{content:"🐙";font-size:clamp(10px,4vw,17px);line-height:1;opacity:.95;background:transparent;width:auto;height:auto}.cell.preview{background:#f1a66a;opacity:.72}.cell.bad{background:#ef786b;opacity:.8}.cell.clearing{animation:pop .35s ease both}@keyframes pop{50%{transform:scale(.78);filter:brightness(1.6)}100%{transform:scale(.4);opacity:.1}}.board:before{content:"";position:absolute;inset:0;pointer-events:none}.board.gridflash{animation:flash .42s ease}@keyframes flash{50%{box-shadow:0 0 0 3px #f1a66a,0 0 28px #f1a66a77}}.callout{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;min-height:21px}.callout b{color:var(--foam)}.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 6px 5px;background:linear-gradient(180deg,#102e3700,#102e37aa);border-radius:20px}.piece-slot{min-height:92px;border-radius:17px;background:#102f38;border:1px solid #1c4852;display:grid;place-items:center;touch-action:none;position:relative}.piece-slot.selected{border-color:var(--coral);box-shadow:0 0 0 2px #f1a66a33}.piece-slot.used{opacity:.22}.piece-grid{display:grid;gap:4px;touch-action:none}.piece-cell{width:clamp(17px,5.4vw,25px);height:clamp(17px,5.4vw,25px);border-radius:6px;background:var(--sea);box-shadow:inset 0 -3px 0 #329d92}.piece-cell.empty{background:transparent;box-shadow:none}.hint{font-size:11px;color:#83aaa7;text-align:center;margin-top:-7px}.actions{display:flex;gap:9px}.wide{flex:1;min-height:48px;border-radius:16px;background:#133943;border:1px solid #23535e;font-weight:750}.wide.primary{background:var(--coral);color:#2b2118;border-color:#ffc18d}.wide:active,.iconbtn:active{transform:scale(.97)}.bottom{margin-top:auto;text-align:center;font-size:10px;color:#648d8c;letter-spacing:.12em;text-transform:uppercase}.modal{position:fixed;inset:0;background:#06171dcc;display:none;place-items:center;padding:22px;z-index:5}.modal.show{display:grid}.dialog{width:min(100%,360px);padding:23px;border-radius:24px;background:#12343d;border:1px solid #2e6570;box-shadow:0 22px 55px #0008}.dialog h2{margin:0 0 7px;font-size:25px}.dialog p{color:#b2ceca;line-height:1.55;font-size:14px}.dialog .row{display:flex;gap:8px;flex-wrap:wrap}.dialog .wide{min-width:115px;padding:0 12px}.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 137px);transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:10px 15px;background:#f1a66a;color:#2a1e18;font-weight:850;border-radius:20px;transition:.22s;z-index:3;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.float{position:absolute;pointer-events:none;color:#ffe2b9;font-size:19px;font-weight:900;text-shadow:0 2px 6px #0008;animation:floatUp .8s ease forwards;z-index:2}@keyframes floatUp{to{opacity:0;transform:translateY(-42px) scale(1.25)}}.octo{position:absolute;top:-11px;right:18px;font-size:22px;animation:bob 2s ease-in-out infinite;pointer-events:none}@keyframes bob{50%{transform:translateY(-5px) rotate(6deg)}}.mute{opacity:.55}button:focus-visible{outline:3px solid var(--foam);outline-offset:2px}@media(max-height:730px){#app{gap:11px;padding-top:calc(env(safe-area-inset-top) + 9px)}.piece-slot{min-height:78px}.hint{margin-top:-5px}.board{gap:2px;padding:6px}.cell{border-radius:4px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><main id="app"><header class="top"><div class="brand"><div class="mark">🐙</div><div><div class="word">TIDEGRID</div><div class="sub">deep-sea block puzzle</div></div></div><button id="sound" class="iconbtn" aria-label="Toggle sound">♪</button></header><section class="stats"><div class="stat"><label>Best dive</label><strong id="best">0</strong></div><div class="stat center"><label>Current score</label><strong id="score">0</strong></div><div class="stat"><label>Combo</label><strong id="combo">—</strong></div></section><div class="callout"><span id="message">Pick a piece. Find your flow.</span><span><b>9×9</b> reef</span></div><section class="boardwrap"><div class="octo" aria-hidden="true">🐙</div><div id="board" class="board" role="grid" aria-label="9 by 9 puzzle board"></div></section><div class="callout"><span><b>Choose a shape</b></span><span id="remaining">3 pieces</span></div><section id="dock" class="dock" aria-label="Available pieces"></section><div class="hint">Tap a shape, then a glowing spot • or drag it onto the reef</div><section class="actions"><button id="newgame" class="wide">↻ New dive</button><button id="howto" class="wide">How to play</button></section><footer class="bottom">No ads. No timers. Just tide & tide again.</footer></main><div id="toast" class="toast"></div><div id="modal" class="modal" role="dialog" aria-modal="true"></div>
<script src="./game-core.js"></script>
<script>
  (function(){
    const core=window.TIDEGRID_CORE;
    const $=s=>document.querySelector(s), boardEl=$('#board'), dockEl=$('#dock');
    let game, selected=-1, preview=null, toastTimer, soundOn=true, audioCtx;
    const saveKey='tidegrid-save-v1';
    function load(){try{return JSON.parse(localStorage.getItem(saveKey)||'null')}catch{return null}}
    function persist(){try{localStorage.setItem(saveKey,JSON.stringify({board:game.board,pieces:game.pieces,score:game.score,best:game.best,combo:game.combo,moves:game.moves,seed:game.seed}))}catch{}}
    function fresh(){const best=game?.best||load()?.best||0;game=core.createGame(Date.now());game.best=best;selected=-1;preview=null;render();persist();say('New tide, fresh reef.')}
    function render(){
      $('#score').textContent=game.score;$('#best').textContent=game.best;$('#combo').textContent=game.combo>1?`${game.combo}×`:'—';
      const remaining=game.pieces.filter(Boolean).length;$('#remaining').textContent=`${remaining} ${remaining===1?'piece':'pieces'}`;
      boardEl.innerHTML='';
      for(let r=0;r<9;r++)for(let c=0;c<9;c++){
        const cell=document.createElement('div');cell.className='cell'+(game.board[r][c]?' filled octopus':'');cell.setAttribute('role','gridcell');cell.dataset.r=r;cell.dataset.c=c;
        if(preview&&preview.r===r&&preview.c===c)cell.classList.add(preview.valid?'preview':'bad');
        if(r%3===0&&r!==0)cell.style.marginTop='3px';if(c%3===0&&c!==0)cell.style.marginLeft='3px';boardEl.appendChild(cell)
      }
      dockEl.innerHTML='';
      game.pieces.forEach((piece,i)=>{const slot=document.createElement('button');slot.className='piece-slot'+(!piece?' used':'')+(i===selected?' selected':'');slot.setAttribute('aria-label',piece?`Select shape ${i+1}`:`Used shape ${i+1}`);slot.dataset.i=i;
        if(piece){const grid=document.createElement('div');grid.className='piece-grid';grid.style.gridTemplateColumns=`repeat(${piece[0].length},auto)`;piece.forEach(row=>row.forEach(v=>{const d=document.createElement('i');d.className='piece-cell'+(!v?' empty':'');grid.appendChild(d)}));slot.appendChild(grid);slot.addEventListener('click',()=>selectPiece(i));slot.addEventListener('pointerdown',e=>dragStart(e,i))}dockEl.appendChild(slot)
      });
      if(remaining===0){game.pieces=core.dealPieces(game.seed+game.moves+1);selected=-1}
    }
    function selectPiece(i){if(!game.pieces[i])return;selected=i;preview=null;render();say('Tap a glowing place on the reef.')}
    function showToast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1150)}
    function say(text){$('#message').textContent=text}
    function tone(freq=520,duration=.07){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}catch{}}
    function floatScore(text){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left='44%';f.style.top='38%';boardEl.appendChild(f);setTimeout(()=>f.remove(),850)}
    function attempt(r,c){if(selected<0||!game.pieces[selected]){say('Choose a shape first.');return}const piece=game.pieces[selected];if(!core.canPlace(game.board,piece,r,c)){tone(180);showToast('That spot is occupied');return}
      game.board=core.placePiece(game.board,piece,r,c);game.score+=core.getPieceCells(piece).length;game.moves++;game.pieces[selected]=null;const cleared=core.clearCompleted(game.board);game.board=cleared.board;
      if(cleared.count){game.combo++;const bonus=cleared.count*cleared.count*15*Math.max(1,game.combo);game.score+=bonus;floatScore(`+${bonus} ✦`);showToast(`${cleared.count} reef ${cleared.count===1?'line':'lines'} cleared!`);tone(760,.12);boardEl.classList.add('gridflash');setTimeout(()=>boardEl.classList.remove('gridflash'),450)}else game.combo=0;
      game.best=Math.max(game.best,game.score);selected=-1;preview=null;
      if(game.pieces.every(p=>!p)){game.pieces=core.dealPieces(game.seed+game.moves*17+game.score);say('A fresh school of shapes!')}else say(cleared.count?'Lovely clear! Keep the current.':'Nice placement.');
      persist();render();if(!hasMove())setTimeout(endGame,250)
    }
    function hasMove(){return game.pieces.some(piece=>piece&&core.anyPlacement(game.board,piece))}
    function endGame(){showModal(`<h2>The reef is full 🐙</h2><p>Your dive score: <b>${game.score}</b>. Best dive: <b>${game.best}</b>. Take a breath and try another round.</p><div class="row"><button class="wide primary" id="again">Dive again</button><button class="wide" id="close">Keep score</button></div>`);$('#again').onclick=()=>{hideModal();fresh()};$('#close').onclick=hideModal}
    function showModal(html){const m=$('#modal');m.innerHTML=`<article class="dialog">${html}</article>`;m.classList.add('show')}
    function hideModal(){$('#modal').classList.remove('show')}
    $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')hideModal()});
    $('#newgame').addEventListener('click',()=>{showModal('<h2>Start a new dive?</h2><p>Your current board will be replaced. Your best score stays saved.</p><div class="row"><button class="wide primary" id="confirmNew">New dive</button><button class="wide" id="cancelNew">Keep playing</button></div>')});
    document.addEventListener('click',e=>{if(e.target.id==='confirmNew'){hideModal();fresh()}if(e.target.id==='cancelNew'||e.target.id==='gotit')hideModal()});
    $('#howto').addEventListener('click',()=>showModal('<h2>How to play</h2><p>Place each shape on the 9×9 reef. Fill a full row, column, or 3×3 tide pool to clear it. Tap a shape to select it, then tap a starting square on the reef to place it. Shapes may also be dragged onto the board. Clear multiple groups in one move for a bigger score. Your board and best score save on this device. No ads, no countdown, no rush.</p><div class="row"><button class="wide primary" id="gotit">Got it</button></div>'));
    $('#sound').addEventListener('click',()=>{soundOn=!soundOn;$('#sound').classList.toggle('mute',!soundOn);$('#sound').setAttribute('aria-label',soundOn?'Mute sound':'Enable sound');tone(580)});
    boardEl.addEventListener('click',e=>{const el=e.target.closest('.cell');if(el)attempt(+el.dataset.r,+el.dataset.c)});
    boardEl.addEventListener('pointermove',e=>{if(selected<0)return;const rect=boardEl.getBoundingClientRect();const r=Math.floor((e.clientY-rect.top)/rect.height*9),c=Math.floor((e.clientX-rect.left)/rect.width*9);if(r<0||r>8||c<0||c>8)return;const valid=core.canPlace(game.board,game.pieces[selected],r,c);preview=valid?{r,c,valid:true}:null;render()});
    boardEl.addEventListener('pointerleave',()=>{if(preview){preview=null;render()}});
    function dragStart(e,i){if(!game.pieces[i])return;selected=i;try{e.dataTransfer?.setData('text/plain',String(i))}catch{}}
    boardEl.addEventListener('pointerup',e=>{if(selected<0)return;const rect=boardEl.getBoundingClientRect();const r=Math.floor((e.clientY-rect.top)/rect.height*9),c=Math.floor((e.clientX-rect.left)/rect.width*9);if(r>=0&&r<9&&c>=0&&c<9&&core.canPlace(game.board,game.pieces[selected],r,c))attempt(r,c)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal();if(e.key==='n'||e.key==='N')$('#newgame').click()});
    const saved=load();if(saved&&saved.board?.length===9){game={...saved,best:Math.max(saved.best||0,saved.score||0)};game.pieces=game.pieces||core.dealPieces(game.seed);if(!hasMove()){game=core.createGame(Date.now());game.best=saved.best||0}}else game=core.createGame(Date.now());render();persist();
    if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
    window.TIDEGRID={getState:()=>JSON.parse(JSON.stringify(game)),attempt,hasMove};
  })();
</script>
</body></html>
